<div class="container mt-4">
  <h2>{{ title }}</h2>
  <div class="row">
    @for (item of items; track item.name) {
      <div class="col-6 col-md-3 mb-3">
        <div class="border rounded text-center p-3">
          <div style="font-size: 3rem">{{ item.emoji }}</div>
          <div>{{ item.name }}</div>
        </div>
      </div>
    }
  </div>
</div>
