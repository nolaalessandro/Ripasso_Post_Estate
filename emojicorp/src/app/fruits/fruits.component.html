<div class="container mt-4">
  <div class="row">
    @for (f of fruits; track f.name) {
      <div class="col-6 col-md-3 mb-3">
        <div class="border rounded text-center p-3">
          <div style="font-size: 3rem">{{ f.emoji }}</div>
          <div>{{ f.name }}</div>
        </div>
      </div>
    }
  </div>
</div>
